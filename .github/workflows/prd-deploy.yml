name: Deploy PRD to App Store Connect

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump from the previous PRD release. Use custom to enter an exact version.'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_app_version:
        description: 'Required only when version_bump is custom. Example: 1.2.3'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-context:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.context.outputs.app-version }}
      previous-tag: ${{ steps.context.outputs.previous-tag }}
      previous-version: ${{ steps.context.outputs.previous-version }}
      release-tag: ${{ steps.context.outputs.release-tag }}
      release-title: ${{ steps.context.outputs.release-title }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve previous PRD release
        id: context
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
          CUSTOM_APP_VERSION: ${{ inputs.custom_app_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" != "dev" ]; then
            echo "::error::PRD deploy must run from dev. Current branch: $GITHUB_REF_NAME"
            exit 1
          fi

          previous_tag=""
          while IFS= read -r tag; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && git merge-base --is-ancestor "$tag" HEAD; then
              previous_tag="$tag"
              break
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("prd-v")) | .tagName')

          previous_version="1.0.0"
          if [[ "$previous_tag" =~ ^prd-v([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+$ ]]; then
            previous_version="${BASH_REMATCH[1]}"
          fi

          if [ "$VERSION_BUMP" = "custom" ]; then
            app_version="$CUSTOM_APP_VERSION"
          else
            IFS='.' read -r major minor patch <<< "$previous_version"
            case "$VERSION_BUMP" in
              major)
                app_version="$((major + 1)).0.0"
                ;;
              minor)
                app_version="${major}.$((minor + 1)).0"
                ;;
              patch)
                app_version="${major}.${minor}.$((patch + 1))"
                ;;
              *)
                echo "::error::Unsupported version_bump: $VERSION_BUMP"
                exit 1
                ;;
            esac
          fi

          if ! [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Resolved app version must use semantic version format, for example 1.0.1"
            exit 1
          fi

          if [ "$VERSION_BUMP" = "custom" ] && [ "$app_version" = "$previous_version" ]; then
            echo "::error::custom_app_version must be different from the previous PRD version"
            exit 1
          fi

          release_tag="prd-v${app_version}-${GITHUB_RUN_NUMBER}"
          release_title="PRD v${app_version} #${GITHUB_RUN_NUMBER}"

          {
            echo "app-version=$app_version"
            echo "previous-tag=$previous_tag"
            echo "previous-version=$previous_version"
            echo "release-tag=$release_tag"
            echo "release-title=$release_title"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## PRD deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version bump | \`$VERSION_BUMP\` |"
            echo "| Previous PRD version | \`$previous_version\` |"
            echo "| App version | \`$app_version\` |"
            echo "| Previous PRD release | \`${previous_tag:-none}\` |"
            echo "| New release tag | \`$release_tag\` |"
            echo ""
            echo "> GitHub Actions cannot show a dynamic placeholder before \`Run workflow\`. This summary is the runtime confirmation of the previous PRD version and comparison base."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build iOS PRD
    runs-on: ubuntu-latest
    needs: release-context
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify PRD app config
        env:
          APP_ENV: production
          APP_VERSION: ${{ needs.release-context.outputs.app-version }}
        run: pnpm exec expo config --type public

      - name: Build iOS PRD
        id: build
        env:
          APP_ENV: production
          APP_VERSION: ${{ needs.release-context.outputs.app-version }}
        run: |
          BUILD_JSON=$(eas build --platform ios --profile production --non-interactive --json)
          BUILD_ID=$(echo "$BUILD_JSON" | jq -r '.[0].id')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::Failed to extract build ID"
            echo "$BUILD_JSON"
            exit 1
          fi
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build ID: $BUILD_ID"

  submit:
    name: Submit to App Store Connect
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to App Store Connect
        run: eas submit --platform ios --id ${{ needs.build.outputs.build-id }} --profile production --non-interactive

  release-notes:
    name: Create release notes
    runs-on: ubuntu-latest
    needs:
      - build
      - release-context
      - submit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          APP_VERSION: ${{ needs.release-context.outputs.app-version }}
          PREVIOUS_TAG: ${{ needs.release-context.outputs.previous-tag }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release-tag }}
          RELEASE_TITLE: ${{ needs.release-context.outputs.release-title }}
          BUILD_ID: ${{ needs.build.outputs.build-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## PRD deployment"
            echo ""
            echo "- App version: \`$APP_VERSION\`"
            echo "- EAS build ID: \`$BUILD_ID\`"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "## Changes"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty=format:'- %s (%h)' "$PREVIOUS_TAG"..HEAD
            else
              git log --pretty=format:'- %s (%h)' HEAD
            fi
          } > release-notes.md

          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

  release-pr:
    name: Create main release PR
    runs-on: ubuntu-latest
    needs:
      - build
      - release-context
      - release-notes
    outputs:
      pr-url: ${{ steps.release-pr.outputs.pr-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update release PR
        id: release-pr
        env:
          APP_VERSION: ${{ needs.release-context.outputs.app-version }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release-tag }}
          RELEASE_TITLE: ${{ needs.release-context.outputs.release-title }}
          BUILD_ID: ${{ needs.build.outputs.build-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main dev

          if git diff --quiet origin/main..origin/dev; then
            {
              echo "## Main release PR"
              echo ""
              echo "main already contains dev. No release PR was created."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "pr-url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "## PRD 릴리즈 반영"
            echo ""
            echo "이 PR은 PRD 배포 workflow가 App Store Connect 업로드와 GitHub Release 생성을 완료한 뒤 자동 생성했습니다."
            echo ""
            echo "## 배포 정보"
            echo ""
            echo "- 앱 버전: \`$APP_VERSION\`"
            echo "- 릴리즈 태그: \`$RELEASE_TAG\`"
            echo "- EAS build ID: \`$BUILD_ID\`"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "## main에 반영될 커밋"
            echo ""
            git log --pretty=format:'- %s (%h)' origin/main..origin/dev
            echo ""
            echo ""
            echo "## 체크리스트"
            echo ""
            echo "- [ ] App Store Connect 빌드 업로드 확인"
            echo "- [ ] GitHub Release Note 확인"
            echo "- [ ] main 병합 전 릴리즈 범위 확인"
          } > release-pr-body.md

          title="release: PRD v${APP_VERSION}"
          existing_pr="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // ""')"

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$title" --body-file release-pr-body.md
            pr_url="$(gh pr view "$existing_pr" --json url --jq '.url')"
          else
            pr_url="$(gh pr create --base main --head dev --title "$title" --body-file release-pr-body.md)"
          fi

          echo "pr-url=$pr_url" >> "$GITHUB_OUTPUT"

          {
            echo "## Main release PR"
            echo ""
            echo "$pr_url"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs:
      - release-context
      - release-notes
      - release-pr

    steps:
      - name: Notify Discord
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.release-tag }}
          RELEASE_PR_URL: ${{ needs.release-pr.outputs.pr-url }}
        run: |
          content="**PRD App Store Connect 업로드 성공**\\nRelease: ${RELEASE_TAG}"
          if [ -n "$RELEASE_PR_URL" ]; then
            content="${content}\\nMain release PR: ${RELEASE_PR_URL}"
          fi
          payload="$(jq -n --arg content "$content" '{content: $content}')"

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${{ secrets.DISCORD_WEBHOOK_URL_DEV_DEPOLY }}"
