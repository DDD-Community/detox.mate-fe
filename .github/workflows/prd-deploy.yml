name: Promote Prod TestFlight to Release

on:
  workflow_dispatch:
    inputs:
      testflight_release_tag:
        description: 'Prod TestFlight release tag to promote. Example: prod-tf-v1.2.3-123'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-context:
    name: Resolve promotion context
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.context.outputs.app-version }}
      previous-tag: ${{ steps.context.outputs.previous-tag }}
      release-tag: ${{ steps.context.outputs.release-tag }}
      release-title: ${{ steps.context.outputs.release-title }}
      testflight-release-tag: ${{ steps.context.outputs.testflight-release-tag }}
      testflight-release-url: ${{ steps.context.outputs.testflight-release-url }}
      commit-sha: ${{ steps.context.outputs.commit-sha }}
      build-id: ${{ steps.context.outputs.build-id }}
      asc-app-id: ${{ steps.context.outputs.asc-app-id }}
      workflow-run: ${{ steps.context.outputs.workflow-run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve TestFlight release
        id: context
        env:
          TESTFLIGHT_RELEASE_TAG: ${{ inputs.testflight_release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" != "dev" ]; then
            echo "::error::PRD promotion must run from dev. Current branch: $GITHUB_REF_NAME"
            exit 1
          fi

          if ! [[ "$TESTFLIGHT_RELEASE_TAG" =~ ^prod-tf-v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::testflight_release_tag must match prod-tf-v<version>-<run_number>"
            exit 1
          fi

          release_json="$(gh release view "$TESTFLIGHT_RELEASE_TAG" --json body,isPrerelease,targetCommitish,url)"
          is_prerelease="$(echo "$release_json" | jq -r '.isPrerelease')"
          release_url="$(echo "$release_json" | jq -r '.url')"
          target_commitish="$(echo "$release_json" | jq -r '.targetCommitish')"
          release_body="$(echo "$release_json" | jq -r '.body')"

          if [ "$is_prerelease" != "true" ]; then
            echo "::error::$TESTFLIGHT_RELEASE_TAG is not a prerelease record"
            exit 1
          fi

          metadata="$(printf '%s\n' "$release_body" | awk '/^```properties$/ {capture=1; next} /^```$/ && capture {capture=0} capture')"

          app_version="$(printf '%s\n' "$metadata" | awk -F= '$1 == "app_version" {print $2; exit}')"
          commit_sha="$(printf '%s\n' "$metadata" | awk -F= '$1 == "commit_sha" {print $2; exit}')"
          build_id="$(printf '%s\n' "$metadata" | awk -F= '$1 == "eas_build_id" {print $2; exit}')"
          asc_app_id="$(printf '%s\n' "$metadata" | awk -F= '$1 == "asc_app_id" {print $2; exit}')"
          workflow_run="$(printf '%s\n' "$metadata" | awk -F= '$1 == "workflow_run" {print $2; exit}')"

          if [ -z "$app_version" ] || [ -z "$commit_sha" ] || [ -z "$build_id" ] || [ -z "$asc_app_id" ] || [ -z "$workflow_run" ]; then
            echo "::error::Missing promotion metadata in $TESTFLIGHT_RELEASE_TAG"
            exit 1
          fi

          if ! [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid app_version in promotion metadata: $app_version"
            exit 1
          fi

          if [ "$target_commitish" != "$commit_sha" ]; then
            echo "::error::Release target commit ($target_commitish) does not match metadata commit ($commit_sha)"
            exit 1
          fi

          if [ "$GITHUB_SHA" != "$commit_sha" ]; then
            echo "::error::Current dev HEAD ($GITHUB_SHA) does not match TestFlight commit ($commit_sha)"
            exit 1
          fi

          previous_tag=""
          while IFS= read -r tag; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && git merge-base --is-ancestor "$tag" HEAD; then
              previous_tag="$tag"
              break
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("prd-v")) | .tagName')

          release_tag="prd-v${app_version}-${GITHUB_RUN_NUMBER}"
          release_title="PRD v${app_version} #${GITHUB_RUN_NUMBER}"

          {
            echo "app-version=$app_version"
            echo "previous-tag=$previous_tag"
            echo "release-tag=$release_tag"
            echo "release-title=$release_title"
            echo "testflight-release-tag=$TESTFLIGHT_RELEASE_TAG"
            echo "testflight-release-url=$release_url"
            echo "commit-sha=$commit_sha"
            echo "build-id=$build_id"
            echo "asc-app-id=$asc_app_id"
            echo "workflow-run=$workflow_run"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## PRD promotion"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| TestFlight release | \`$TESTFLIGHT_RELEASE_TAG\` |"
            echo "| App version | \`$app_version\` |"
            echo "| EAS build ID | \`$build_id\` |"
            echo "| Commit | \`$commit_sha\` |"
            echo "| New PRD release tag | \`$release_tag\` |"
            echo ""
            echo "> No EAS Build or EAS Submit runs in this workflow. Select the same build in App Store Connect and submit it for review manually."
          } >> "$GITHUB_STEP_SUMMARY"

  release-notes:
    name: Create release notes
    runs-on: ubuntu-latest
    needs: release-context

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          APP_VERSION: ${{ needs.release-context.outputs.app-version }}
          PREVIOUS_TAG: ${{ needs.release-context.outputs.previous-tag }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release-tag }}
          RELEASE_TITLE: ${{ needs.release-context.outputs.release-title }}
          TESTFLIGHT_RELEASE_TAG: ${{ needs.release-context.outputs.testflight-release-tag }}
          TESTFLIGHT_RELEASE_URL: ${{ needs.release-context.outputs.testflight-release-url }}
          COMMIT_SHA: ${{ needs.release-context.outputs.commit-sha }}
          BUILD_ID: ${{ needs.release-context.outputs.build-id }}
          ASC_APP_ID: ${{ needs.release-context.outputs.asc-app-id }}
          WORKFLOW_RUN: ${{ needs.release-context.outputs.workflow-run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## PRD promotion"
            echo ""
            echo "- App version: \`$APP_VERSION\`"
            echo "- EAS build ID: \`$BUILD_ID\`"
            echo "- App Store Connect app ID: \`$ASC_APP_ID\`"
            echo "- TestFlight release: [$TESTFLIGHT_RELEASE_TAG]($TESTFLIGHT_RELEASE_URL)"
            echo "- TestFlight workflow run: $WORKFLOW_RUN"
            echo "- Promotion workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo ""
            echo "## Manual App Store Connect checklist"
            echo ""
            echo "- [ ] App Store Connect에서 앱 버전 \`$APP_VERSION\` 선택"
            echo "- [ ] TestFlight에서 검증한 동일 build를 App Store 버전에 선택"
            echo "- [ ] 심사 정보 확인 후 App Review 제출"
            echo "- [ ] 승인 후 출시 방식 확인"
            echo ""
            echo "## Changes"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty=format:'- %s (%h)' "$PREVIOUS_TAG"..HEAD
            else
              git log --pretty=format:'- %s (%h)' HEAD
            fi
          } > release-notes.md

          gh release create "$RELEASE_TAG" \
            --target "$COMMIT_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

  release-pr:
    name: Create main release PR
    runs-on: ubuntu-latest
    needs:
      - release-context
      - release-notes
    outputs:
      pr-url: ${{ steps.release-pr.outputs.pr-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update release PR
        id: release-pr
        env:
          APP_VERSION: ${{ needs.release-context.outputs.app-version }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release-tag }}
          RELEASE_TITLE: ${{ needs.release-context.outputs.release-title }}
          TESTFLIGHT_RELEASE_TAG: ${{ needs.release-context.outputs.testflight-release-tag }}
          TESTFLIGHT_RELEASE_URL: ${{ needs.release-context.outputs.testflight-release-url }}
          BUILD_ID: ${{ needs.release-context.outputs.build-id }}
          ASC_APP_ID: ${{ needs.release-context.outputs.asc-app-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main dev

          if git diff --quiet origin/main..origin/dev; then
            {
              echo "## Main release PR"
              echo ""
              echo "main already contains dev. No release PR was created."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "pr-url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "## PRD 릴리즈 반영"
            echo ""
            echo "이 PR은 검증된 Prod TestFlight build를 운영 릴리즈 기록으로 승격한 뒤 자동 생성했습니다."
            echo ""
            echo "## 배포 정보"
            echo ""
            echo "- 앱 버전: \`$APP_VERSION\`"
            echo "- 릴리즈 태그: \`$RELEASE_TAG\`"
            echo "- TestFlight 릴리즈: [$TESTFLIGHT_RELEASE_TAG]($TESTFLIGHT_RELEASE_URL)"
            echo "- EAS build ID: \`$BUILD_ID\`"
            echo "- App Store Connect app ID: \`$ASC_APP_ID\`"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "## App Store Connect 수동 체크리스트"
            echo ""
            echo "- [ ] App Store Connect에서 앱 버전 \`$APP_VERSION\` 선택"
            echo "- [ ] TestFlight에서 검증한 동일 build를 App Store 버전에 선택"
            echo "- [ ] App Review 제출"
            echo ""
            echo "## main에 반영될 커밋"
            echo ""
            git log --pretty=format:'- %s (%h)' origin/main..origin/dev
          } > release-pr-body.md

          title="release: PRD v${APP_VERSION}"
          existing_pr="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // ""')"

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$title" --body-file release-pr-body.md
            pr_url="$(gh pr view "$existing_pr" --json url --jq '.url')"
          else
            pr_url="$(gh pr create --base main --head dev --title "$title" --body-file release-pr-body.md)"
          fi

          echo "pr-url=$pr_url" >> "$GITHUB_OUTPUT"

          {
            echo "## Main release PR"
            echo ""
            echo "$pr_url"
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs:
      - release-context
      - release-notes
      - release-pr

    steps:
      - name: Notify Discord
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.release-tag }}
          RELEASE_PR_URL: ${{ needs.release-pr.outputs.pr-url }}
          APP_VERSION: ${{ needs.release-context.outputs.app-version }}
          BUILD_ID: ${{ needs.release-context.outputs.build-id }}
        run: |
          content="**PRD 릴리즈 승격 완료**\\nRelease: ${RELEASE_TAG}\\nApp version: ${APP_VERSION}\\nEAS build ID: ${BUILD_ID}\\nApp Store Connect에서 같은 TestFlight build를 선택해 App Review에 제출하세요."
          if [ -n "$RELEASE_PR_URL" ]; then
            content="${content}\\nMain release PR: ${RELEASE_PR_URL}"
          fi
          payload="$(jq -n --arg content "$content" '{content: $content}')"

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${{ secrets.DISCORD_WEBHOOK_URL_DEV_DEPOLY }}"
